<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Title is overridden at runtime by Angular's Title service from CRM site_name setting.
       Bots receive a server-injected <title> via the InjectSeoForBots middleware. -->
  <title>Site</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Self-hosted fonts: preload the two above-the-fold Arabic subsets (hero
       heading + body) so LCP text paints without a third-party round-trip.
       The full @font-face set is inlined in the CSS bundle. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/fonts/tajawal-Iurf6YBj_oCad4k1l5anHrRpiYlJ.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/fonts/alexandria-UMBXrPdDqW66y0Y2usFeaijdA4M5.woff2">
</head>
<body class="bg-surface text-wood-900 font-sans antialiased selection:bg-accent selection:text-white">
  <app-root></app-root>
</body>
</html>
